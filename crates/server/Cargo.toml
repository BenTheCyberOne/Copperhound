[package]
name = "ch-server"
description = "CopperHound REST API and web UI server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ch-model.workspace = true
ch-store.workspace = true
ch-ingest.workspace = true
ch-engine.workspace = true
ch-query.workspace = true
ch-analysis.workspace = true
anyhow.workspace = true
ahash.workspace = true
parking_lot.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "net", "io-util", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.2"
humantime = "2"
argon2 = "0.5"
sha2 = { version = "0.10", features = ["oid"] }
# Notifications (rustls only, no OpenSSL).
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
# OIDC single sign-on: rustls only (no OpenSSL); jsonwebtoken with the pure-Rust crypto backend.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
base64 = "0.22"
url = "2"
# SAML single sign-on: pure Rust (no libxml2 / xmlsec).
roxmltree = "0.21"
x509-cert = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
flate2.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zip.workspace = true
# Built-in HTTPS: rustls with the ring backend (no aws-lc / C toolchain), self-signed certs via rcgen.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Built-in LDAP collector: pure-Rust client, rustls (ring) for LDAPS / StartTLS.
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# Two-factor sign-in (TOTP): HMAC-SHA1 per RFC 6238, QR code as SVG.
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
ch-synth.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
